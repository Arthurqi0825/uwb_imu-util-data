  - [-3.2776, -3.8690, 2.6739]   # anchor 4
  - [3.2655, -3.6511, 0.1752]    # anchor 5
  - [3.8321, 3.6521, 2.6249]     # anchor 6
  - [-2.7228, 3.2191, 0.1583]    # anchor 7
